[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(^|/)tests/"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["services/api/tests", "services/agent/tests"]
