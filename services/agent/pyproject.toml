[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer-agent"
version = "0.1.0"
description = "AI Interviewer agent runtime"
requires-python = ">=3.12"
dependencies = [
	"langgraph>=1.2.10",
	"langgraph-checkpoint-sqlite>=3.0.0",
]

[project.optional-dependencies]
postgres = [
	"langgraph-checkpoint-postgres>=3.1.2",
	"psycopg[binary,pool]>=3.2.0",
]

[tool.setuptools]
packages = ["services.agent", "services.agent.evals", "services.agent.graph", "services.agent.retrieval"]
package-dir = {"services.agent" = "."}

[tool.setuptools.package-data]
"services.agent" = ["fixtures/*.json", "fixtures/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
