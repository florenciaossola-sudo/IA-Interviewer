name: ai-interviewer

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: infra/airflow/Dockerfile
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-aiuser}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PYTHONPATH: /opt/ai-interviewer
    AI_INTERVIEWER_API_URL: ${AI_INTERVIEWER_API_URL:-http://host.docker.internal:8081}
    AI_INTERVIEWER_DB_BACKEND: postgres
    AI_INTERVIEWER_POSTGRES_DSN: postgresql://${POSTGRES_USER:-aiuser}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/ai_interviewer
    AI_INTERVIEWER_LANGGRAPH_POSTGRES_DSN: postgresql://${POSTGRES_USER:-aiuser}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/ai_interviewer_langgraph
    AI_INTERVIEWER_RETRIEVAL_BACKEND: pgvector
    AI_INTERVIEWER_LAKEHOUSE_ENABLED: "1"
    AI_INTERVIEWER_DUCKDB_PATH: /opt/ai-interviewer/data/lakehouse/warehouse.duckdb
    AI_INTERVIEWER_LAKEHOUSE_DIR: /opt/ai-interviewer/data/lakehouse/parquet
    AI_INTERVIEWER_MINIO_ENDPOINT: minio:9000
    AI_INTERVIEWER_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    AI_INTERVIEWER_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-only}
    AI_INTERVIEWER_MINIO_BUCKET: ai-interviewer-lakehouse
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-local-airflow-only}
  volumes:
    - ../:/opt/ai-interviewer
    - ./airflow/dags:/opt/airflow/dags
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_started
  restart: unless-stopped
  profiles: [airflow]

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ai_interviewer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiuser} -d ai_interviewer"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: >-
      bash -c "airflow db migrate &&
      (airflow users create --username \"$$AIRFLOW_ADMIN_USERNAME\" --password \"$$AIRFLOW_ADMIN_PASSWORD\"
      --firstname Local --lastname Admin --role Admin --email admin@example.local || true)"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data: